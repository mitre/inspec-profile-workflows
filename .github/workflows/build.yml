name: Build Profile Archive

on:
  workflow_call:
    inputs:
      auditor:
        description: Bundled executable to use (cinc-auditor or inspec).
        type: string
        default: cinc-auditor
      ruby-version:
        description: Ruby version used to install the calling profile's Gemfile.
        type: string
        default: "3.3"
    outputs:
      archive:
        description: Profile archive filename.
        value: ${{ jobs.archive.outputs.archive }}
      tag:
        description: Release tag derived from inspec.yml.
        value: ${{ jobs.archive.outputs.tag }}

permissions:
  contents: read

jobs:
  archive:
    name: Build and Validate Archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
      tag: ${{ steps.metadata.outputs.tag }}
    env:
      LC_ALL: en_US.UTF-8
      AUDITOR: ${{ inputs.auditor }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out profile repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1.324.0
        with:
          ruby-version: ${{ inputs.ruby-version }}

      - name: Check profile metadata
        id: metadata
        run: |
          case "$AUDITOR" in
            cinc-auditor|inspec) ;;
            *) echo "::error::auditor must be cinc-auditor or inspec"; exit 1 ;;
          esac
          ruby -ryaml -rdate -e '
            # permitted_classes: an inspec.yml may carry a bare date (release_date,
            # copyright year written unquoted); safe_load raises on it otherwise.
            metadata = YAML.safe_load(File.read("inspec.yml"), permitted_classes: [Date, Time])
            name = metadata.fetch("name").to_s
            version = metadata.fetch("version").to_s
            abort "Profile name must contain only letters, numbers, dots, underscores, or hyphens and start with a letter or number" unless name.match?(/\A[a-zA-Z0-9][a-zA-Z0-9._-]*\z/)
            abort "Release version must use X.Y.Z" unless version.match?(/\A\d+\.\d+\.\d+\z/)
            dependencies = metadata.fetch("depends", []) || []
            abort "Profile depends must be an array" unless dependencies.is_a?(Array)
            archive = "#{name}-#{version}.tar.gz"
            File.open(ENV.fetch("GITHUB_ENV"), "a") { |env| env.puts "ARCHIVE=#{archive}" }
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "archive=#{archive}"
              output.puts "tag=v#{version}"
            end
          '

      - name: Run Bundle Install
        run: bundle install

      - name: Installed Auditor
        run: bundle exec "$AUDITOR" version

      - name: Archive the Profile
        # Archive vendors profile dependencies; they do not need to be committed.
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          bundle exec "$AUDITOR" archive . --tar --output "$RUNNER_TEMP/release/$ARCHIVE"

      - name: Check the archived Profile
        run: |
          bundle exec "$AUDITOR" check "$RUNNER_TEMP/release/$ARCHIVE"

      - name: Check vendored dependencies match the lockfile
        # Presence of a vendor/ path proves nothing: it is satisfied by any
        # unrelated path such as spec/vendor/. Cross-check every dependency the
        # lockfile resolved against a real vendored profile directory.
        env:
          ARCHIVE_ROOT: ${{ runner.temp }}/archive-check
        run: |
          rm -rf "$ARCHIVE_ROOT"
          mkdir -p "$ARCHIVE_ROOT"
          tar -xzf "$RUNNER_TEMP/release/$ARCHIVE" -C "$ARCHIVE_ROOT"
          ruby -ryaml -rdate -e '
            root = ENV.fetch("ARCHIVE_ROOT")
            permitted = { permitted_classes: [Date, Time] }
            metadata = YAML.safe_load(File.read(File.join(root, "inspec.yml")), **permitted)
            declared = metadata.fetch("depends", []) || []
            abort "Profile depends must be an array" unless declared.is_a?(Array)
            if declared.empty?
              puts "No dependencies declared; nothing to vendor."
              exit
            end
            lockfile = File.join(root, "inspec.lock")
            abort "Archive has no inspec.lock; dependencies were not vendored" unless File.file?(lockfile)
            lock = YAML.safe_load(File.read(lockfile), **permitted)
            resolved = lock.is_a?(Hash) ? (lock.fetch("depends", []) || []) : []
            abort "inspec.lock resolved no dependencies" unless resolved.is_a?(Array) && !resolved.empty?
            declared_names = declared.map { |entry| entry["name"].to_s }.sort
            resolved_names = resolved.map { |entry| entry["name"].to_s }.sort
            abort "inspec.lock resolves #{resolved_names.inspect} but inspec.yml declares #{declared_names.inspect}" unless declared_names == resolved_names
            resolved.each do |dependency|
              name = dependency["name"].to_s
              source = dependency["resolved_source"]
              abort "Dependency #{name} has no resolved_source in inspec.lock" unless source.is_a?(Hash)
              key = (source["ref"] || source["sha256"]).to_s
              if key.empty?
                # A path dependency resolves on disk and fetches nothing.
                abort "Dependency #{name} resolved without a ref or sha256" unless source.key?("path")
                puts "Dependency #{name} is a local path; nothing to vendor."
                next
              end
              vendored = File.join(root, "vendor", key)
              abort "Dependency #{name} resolved to #{key} but vendor/#{key}/ is not in the archive" unless File.directory?(vendored)
              abort "vendor/#{key}/ has no inspec.yml; it is not a vendored profile" unless File.file?(File.join(vendored, "inspec.yml"))
              puts "Vendored #{name} -> vendor/#{key}"
            end
          '

      - name: Verify the archive resolves offline
        # Structural checks cannot prove air-gapped use. Blackhole egress and
        # point the vendor cache at an empty directory so resolution can fall
        # back neither to the network nor to the cache the archive step filled.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ""
        run: |
          rm -rf "$RUNNER_TEMP/offline-cache"
          mkdir -p "$RUNNER_TEMP/offline-cache"
          bundle exec "$AUDITOR" check \
            --vendor-cache "$RUNNER_TEMP/offline-cache" \
            "$RUNNER_TEMP/release/$ARCHIVE"

      - name: Generate checksum
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload archive for testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: release-profile
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "### Profile archive"
            echo "Archive: $ARCHIVE"
            echo "Build run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "To request a release, run Request Profile Release. Optionally supply this run ID to select this exact build."
            echo "Only successful push builds from the configured release branch can be published."
          } >> "$GITHUB_STEP_SUMMARY"
