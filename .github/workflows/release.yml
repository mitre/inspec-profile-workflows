name: Request Profile Release

on:
  workflow_call:
    inputs:
      build-run-id:
        description: Optional build run ID; leave blank for the latest successful release-branch push build.
        type: string
        default: ""
      build-workflow:
        description: Filename of the calling repository's automatic build workflow.
        type: string
        default: build.yml
      release-branch:
        description: Branch required for both the source build and manual publication request.
        type: string
        default: main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Selected Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
      tag: ${{ steps.metadata.outputs.tag }}
      build_sha: ${{ steps.source.outputs.build_sha }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      build_run_id: ${{ steps.selection.outputs.build_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build-run-id }}
      BUILD_WORKFLOW: ${{ inputs.build-workflow }}
      RELEASE_BRANCH: ${{ inputs.release-branch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1.324.0
        with:
          ruby-version: "3.3"

      - name: Validate publication request
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::Publication must be requested manually from the release branch."
            exit 1
          fi
          [[ -z "$BUILD_RUN_ID" || "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Leave the build run ID blank or enter a numeric ID."; exit 1; }
          [[ "$BUILD_WORKFLOW" =~ ^[a-zA-Z0-9_-][a-zA-Z0-9_.-]*\.ya?ml$ ]] || { echo "::error::Enter a build workflow filename, not a path."; exit 1; }

      - name: Select source build
        id: selection
        # Resolve latest once, before approval. Never select a different build after review.
        run: |
          if [ -z "$BUILD_RUN_ID" ]; then
            gh api --method GET "repos/$GH_REPO/actions/workflows/$BUILD_WORKFLOW/runs" \
              -f branch="$RELEASE_BRANCH" -f event=push -f status=success -f per_page=1 > "$RUNNER_TEMP/latest-build.json"
            BUILD_RUN_ID=$(ruby -rjson -e '
              runs = JSON.parse(File.read(File.join(ENV.fetch("RUNNER_TEMP"), "latest-build.json"))).fetch("workflow_runs")
              abort "No successful push build exists on the release branch" if runs.empty?
              id = runs.first.fetch("id")
              abort "Invalid build run ID" unless id.is_a?(Integer) && id.positive?
              puts id
            ')
          fi
          echo "BUILD_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_ENV"
          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Validate source run and artifact
        id: source
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GH_REPO/actions/workflows/$BUILD_WORKFLOW" > "$RUNNER_TEMP/source-workflow.json"
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifacts.json"
          ruby -rjson -e '
            directory = ENV.fetch("RUNNER_TEMP")
            run = JSON.parse(File.read(File.join(directory, "source-run.json")))
            workflow = JSON.parse(File.read(File.join(directory, "source-workflow.json")))
            pages = JSON.parse(File.read(File.join(directory, "source-artifacts.json")))
            repo = ENV.fetch("GH_REPO")
            path = ".github/workflows/#{ENV.fetch("BUILD_WORKFLOW")}"
            abort "Build run ID does not match" unless run.fetch("id").to_s == ENV.fetch("BUILD_RUN_ID")
            abort "Build must belong to this repository" unless run.dig("repository", "full_name") == repo && run.dig("head_repository", "full_name") == repo
            abort "Unexpected build workflow" unless run.fetch("workflow_id") == workflow.fetch("id") && workflow.fetch("path") == path && run.fetch("path") == path
            abort "Build must be a push to the release branch" unless run.fetch("event") == "push" && run.fetch("head_branch") == ENV.fetch("RELEASE_BRANCH")
            abort "Build must have completed successfully" unless run.fetch("status") == "completed" && run.fetch("conclusion") == "success"
            sha = run.fetch("head_sha")
            abort "Invalid build commit" unless sha.match?(/\A[0-9a-f]{40}\z/)
            artifacts = pages.flat_map { |page| page.fetch("artifacts") }.select { |artifact| artifact.fetch("name") == "release-profile" }
            abort "Expected exactly one release-profile artifact" unless artifacts.length == 1
            artifact = artifacts.first
            abort "Build artifact has expired; run a new build" unless artifact.fetch("expired") == false
            abort "Artifact does not belong to the selected build commit" unless artifact.dig("workflow_run", "id") == run.fetch("id") && artifact.dig("workflow_run", "head_sha") == sha
            artifact_id = artifact.fetch("id")
            abort "Invalid artifact ID" unless artifact_id.is_a?(Integer) && artifact_id.positive?
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "build_sha=#{sha}"
              output.puts "artifact_id=#{artifact_id}"
            end
          '

      - name: Check out original build commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ steps.source.outputs.build_sha }}
          persist-credentials: false

      - name: Read original profile metadata
        id: metadata
        run: |
          ruby -ryaml -e '
            metadata = YAML.safe_load(File.read("inspec.yml"))
            name = metadata.fetch("name").to_s
            version = metadata.fetch("version").to_s
            abort "Invalid profile name" unless name.match?(/\A[a-zA-Z0-9][a-zA-Z0-9._-]*\z/)
            abort "Release version must use X.Y.Z" unless version.match?(/\A\d+\.\d+\.\d+\z/)
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "archive=#{name}-#{version}.tar.gz"
              output.puts "tag=v#{version}"
            end
          '

      - name: Publication request summary
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          {
            echo "### Requested profile release"
            echo "Release: $RELEASE_TAG"
            echo "Build: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$BUILD_RUN_ID"
            echo "Original commit: $BUILD_SHA"
            echo "Artifact ID: $ARTIFACT_ID"
            echo "Review this build before approving the Release environment."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Approved Release ${{ needs.validate.outputs.tag }} from build ${{ needs.validate.outputs.build_run_id }}
    needs: validate
    runs-on: ubuntu-latest
    environment: Release
    concurrency:
      group: publish-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      ARCHIVE: ${{ needs.validate.outputs.archive }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      BUILD_SHA: ${{ needs.validate.outputs.build_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require configured approval protection
        # Fail if required reviewers are missing; otherwise GitHub would run without approval.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          protected=$(gh api "repos/$GH_REPO/environments/Release" \
            --jq 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length > 0))')
          if [ "$protected" != "true" ]; then
            echo "::error::Configure required reviewers for the Release environment before publishing."
            exit 1
          fi

      - name: Check out repository and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.build_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check existing release tag
        # Never attach an older build to the manual dispatch commit or another tag target.
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$tag_commit" != "$BUILD_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to a different commit. Bump version in inspec.yml and build again."
              exit 1
            fi
          fi

      - name: Download checked archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          # Pin the artifact ID validated before approval, not a mutable latest-build lookup.
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.build_run_id }}
          path: ${{ runner.temp }}/release/

      - name: Verify downloaded archive
        run: |
          cd "$RUNNER_TEMP/release"
          test -f "$ARCHIVE"
          test -f "$ARCHIVE.sha256"
          sha256sum -c "$ARCHIVE.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/$ARCHIVE" \
            "$RUNNER_TEMP/release/$ARCHIVE.sha256" \
            --target "$BUILD_SHA" --title "$RELEASE_TAG" --generate-notes
