name: Build and Release Profile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  profile:
    # Allow publishing; the called workflow keeps the build job read-only.
    permissions:
      contents: write
    # Replace WORKFLOW_COMMIT_SHA with a published, full 40-character commit SHA.
    uses: mitre/inspec-profile-workflows/.github/workflows/release.yml@WORKFLOW_COMMIT_SHA
    with:
      publish: true
