name: Publish Profile

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Optional build run ID. Leave blank for the latest successful main push build.
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
      actions: read
    # Use the same published shared-workflow commit as the automatic build caller.
    uses: mitre/inspec-profile-workflows/.github/workflows/publish.yml@WORKFLOW_COMMIT_SHA
    with:
      build-run-id: ${{ inputs.build-run-id }}
      build-workflow: release.yml
